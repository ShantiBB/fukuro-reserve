syntax = "proto3";

package booking.v1;

option go_package = "api/booking/v1;bookingv1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";
import "booking/v1/rpc/create_booking.proto";

message QuoteBookingRequest {
  string country_code = 1 [
    (buf.validate.field).string.pattern = "^[a-z]{2}$"
  ];
  string city_slug = 2 [
    (buf.validate.field).string.pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"
  ];
  string hotel_id = 3 [
    (buf.validate.field).string.uuid = true
  ];
  google.protobuf.Timestamp check_in = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt_now = true
  ];
  google.protobuf.Timestamp check_out = 5 [
    (buf.validate.field).required = true
  ];
  string currency = 6 [
    (buf.validate.field).string.pattern = "^[A-Z]{3}$"
  ];
  repeated CreateBookingRoomRequest rooms = 7 [
    (buf.validate.field).repeated.min_items = 1
  ];
  option (buf.validate.message).cel = {
    id: "booking_quote.dates.order"
    message: "check_out must be after check_in"
    expression: "this.check_out > this.check_in"
  };
}

message QuoteBookingRoom {
  string room_id = 1;
  uint32 adults = 2;
  uint32 children = 3;
  string price_per_night = 4;
  string total_amount = 5;
}

message QuoteBookingResponse {
  google.protobuf.Timestamp check_in = 1;
  google.protobuf.Timestamp check_out = 2;
  string currency = 3;
  string total_amount = 4;
  uint32 nights = 5;
  repeated QuoteBookingRoom rooms = 6;
}
