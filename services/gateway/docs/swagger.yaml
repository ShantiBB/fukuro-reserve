info:
  contact: {}
  description: REST API Gateway for Fukuro Reserve microservices.
  title: Swagger Gateway API
  version: "1.0"
paths:
  /{countryCode}/{citySlug}/hotels:
    get:
      description: Public endpoint. Returns hotels in location with optional sorting
        and pagination.
      parameters:
      - description: Country code (ISO 3166-1 alpha-2)
        example: jp
        in: path
        name: countryCode
        required: true
        type: string
      - description: City slug
        example: tokyo
        in: path
        name: citySlug
        required: true
        type: string
      - default: title
        description: Sort field
        enum:
        - title
        - rating
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - default: 1
        description: Page number (starts from 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HotelsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
      summary: Get hotels
      tags:
      - hotels
    post:
      consumes:
      - application/json
      description: Creates a hotel in the selected location. Requires JWT auth and
        role USER_ROLE_MODERATOR or USER_ROLE_ADMIN.
      parameters:
      - description: Country code (ISO 3166-1 alpha-2)
        example: jp
        in: path
        name: countryCode
        required: true
        type: string
      - description: City slug
        example: tokyo
        in: path
        name: citySlug
        required: true
        type: string
      - description: Create hotel request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateHotelBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.HotelResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
      security:
      - Bearer: []
      summary: Create a new hotel
      tags:
      - hotels
  /{countryCode}/{citySlug}/hotels/{hotelId}:
    delete:
      description: Deletes hotel by ID. Requires JWT auth.
      parameters:
      - description: Country code (ISO 3166-1 alpha-2)
        example: jp
        in: path
        name: countryCode
        required: true
        type: string
      - description: City slug
        example: tokyo
        in: path
        name: citySlug
        required: true
        type: string
      - description: Hotel ID
        example: 0f8fad5b-d9cb-469f-a165-70867728950e
        in: path
        name: hotelId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
      security:
      - Bearer: []
      summary: Delete hotel
      tags:
      - hotels
    get:
      description: Public endpoint. Returns hotel details by hotel ID.
      parameters:
      - description: Country code (ISO 3166-1 alpha-2)
        example: jp
        in: path
        name: countryCode
        required: true
        type: string
      - description: City slug
        example: tokyo
        in: path
        name: citySlug
        required: true
        type: string
      - description: Hotel ID
        example: 0f8fad5b-d9cb-469f-a165-70867728950e
        in: path
        name: hotelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HotelResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
      summary: Get hotel by ID
      tags:
      - hotels
    put:
      consumes:
      - application/json
      description: Fully updates mutable hotel fields. Requires JWT auth.
      parameters:
      - description: Country code (ISO 3166-1 alpha-2)
        example: jp
        in: path
        name: countryCode
        required: true
        type: string
      - description: City slug
        example: tokyo
        in: path
        name: citySlug
        required: true
        type: string
      - description: Hotel ID
        example: 0f8fad5b-d9cb-469f-a165-70867728950e
        in: path
        name: hotelId
        required: true
        type: string
      - description: Update hotel request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateHotelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HotelResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responder.ErrorResponse'
      security:
      - Bearer: []
      summary: Update hotel
      tags:
      - hotels
  /{countryCode}/{citySlug}/hotels/{hotelId}/bookings:
    get:
      description: Returns bookings with optional filters and pagination. Requires
