      - description: Hotel ID
        example: 0f8fad5b-d9cb-469f-a165-70867728950e
        in: path
        name: hotelId
        required: true
        type: string
      - description: Filter by user ID
        example: 1
        in: query
        minimum: 1
        name: userId
        type: integer
      - description: Filter by booking status
        example: BOOKING_STATUS_CONFIRMED
        in: query
        name: status
        type: string
      - default: 1
